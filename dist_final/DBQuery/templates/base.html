<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}数据库查询工具{% endblock %}</title>
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container-fluid">
            <a class="navbar-brand app-brand" href="/">📊 数据库查询工具</a>
            <div class="d-flex align-items-center">
                <span id="conn-dot" class="conn-dot conn-unknown"></span>
                <span id="conn-text" class="conn-label">未测试</span>
                <button class="btn btn-nav ms-2" onclick="testConnection()">测试连接</button>
            </div>
        </div>
    </nav>
    <div class="app-body">
        {% block content %}{% endblock %}
    </div>
    <script src="/static/vendor/jquery.min.js"></script>
    <script src="/static/vendor/bootstrap.bundle.min.js"></script>
    <script src="/static/vendor/jquery.dataTables.min.js"></script>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
