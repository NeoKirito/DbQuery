<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}综合查询{% endblock %}</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/dataTables.bootstrap5.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body class="{% if embed_mode %}embed-mode{% else %}standalone-mode{% endif %}{% if sidebar_hidden %} sidebar-hidden-mode{% endif %}"
      data-page="{{ page_name|default('app') }}"
      data-embed-mode="{{ '1' if embed_mode else '0' }}"
      data-sidebar-hidden="{{ '1' if sidebar_hidden else '0' }}">
    <main class="app-body" aria-label="综合查询内容区">
        {% block content %}{% endblock %}
    </main>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    {% if page_name|default('app') != 'login' %}
    <script>
        window.DBQUERY = window.DBQUERY || {};
        window.DBQUERY.apiBase = {{ request.script_root | tojson }};
    </script>
    <script src="{{ url_for('static', filename='vendor/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/jquery.dataTables.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% endif %}
    {% block scripts %}{% endblock %}
</body>
</html>
